name: Release desktop app
# Push a tag such as v0.1.0 to build installers for Windows, macOS and Linux and attach them (and the single HTML file) to a GitHub release.
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 build.py
      - uses: actions/upload-artifact@v4
        with: { name: html, path: dist/index.html }
  desktop:
    needs: html
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: html, path: dist }
      - run: npm install
        working-directory: desktop
      - run: node prepare.js
        working-directory: desktop
      - run: npx electron-builder --publish never
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: List what was built
        shell: bash
        run: ls -la desktop/release
      - uses: actions/upload-artifact@v4          # always: the installers can be downloaded from the run page (Artifacts), also without a tag
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
