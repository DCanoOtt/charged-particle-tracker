name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python3 build.py --lint
      - run: node tests/test_endf.js && node tests/test_decay.js
      - run: python3 tests/test_app.py
      - uses: actions/upload-artifact@v4
        with: { name: charged-particle-tracker-html, path: dist/index.html }
